    <main>
        <h1>Байланыс</h1>
        <p>Бізге хабарласу үшін төмендегі форманы толтырыңыз:</p>

        <form action="#" method="post">
            <label for="name">Атыңыз:</label><br/>
            <input type="text" id="name" name="name" placeholder="Атыңызды жазыңыз" required /><br/><br/>

            <label for="email">Электрондық пошта:</label><br/>
            <input type="email" id="email" name="email" placeholder="Email адресіңізді жазыңыз" required /><br/><br/>

            <label for="message">Хабарлама:</label><br/>
            <textarea id="message" name="message" rows="5" placeholder="Мұнда хабарламаңызды жазыңыз" required></textarea><br/><br/>

            <button type="submit">Жіберу</button>
        </form>
    </main>
</body>
